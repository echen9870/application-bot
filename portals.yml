scan_config:
  recency_hours: 48       # how far back to look for new jobs (24 = last 24h, 48 = last 48h)
  max_yoe: 3              # reject roles requiring more than this many years of experience
  concurrency: 10         # parallel company fetches
  fetch_timeout_ms: 10000 # per-request HTTP timeout in milliseconds

title_filter:
  positive:
    - Software Engineer
    - Software Developer
    - Backend Engineer
    - Full Stack Engineer
    - Full-Stack Engineer
    - Platform Engineer
    - Infrastructure Engineer
    - Application Engineer
    - Product Engineer
    - Founding Engineer
    - Software Engineer Intern
    - Software Developer Intern
    - Engineering Intern
    - SWE Intern
    - New Grad
    - Entry Level
    - University Grad
    - Early Career
    - API Engineer
    - Cloud Engineer
    - DevOps Engineer
    - Site Reliability
    - SRE
    - Distributed Systems
    # Bare "Systems Engineer" was removed 2026-09-01 — 635 labeled rows, only
    # 0.6% applied (vs. 2.7% baseline), and it was the single biggest source of
    # non-software titles (finance/sales/quality/nuclear/campus-recruiting
    # "systems engineer" reqs). Software-flavored systems roles still match via
    # this more specific phrase, or via "Distributed Systems"/"Platform Engineer".
    - Systems Software Engineer
    # Added 2026-08-18 after Simplify-feed audit — common entry-level phrasings the list missed
    - Software Development Engineer
    - Software Development Intern
    - Full Stack Developer
    - Full-Stack Developer
    - Java Developer
    - Python Developer
    - .Net Developer
    - Web Developer
    - Frontend Engineer
    - Front End Engineer
    - Front-End Engineer
    - Quantitative Developer
    - Junior Developer
    - Junior Software
    # Added 2026-09-01 after a live-board audit — these matched neither list
    # and were silently dropped, several in the rubric's own top-weighted
    # domains (kernel/compiler/storage/database/systems programming).
    - Forward Deployed Engineer
    - Linux Engineer
    - Kernel Engineer
    - Compiler Engineer
    - Storage Engineer
    - Database Engineer
    - Rust Engineer
    - Fullstack Engineer
  negative:
    # Seniority — the original list was missing these
    - Senior
    - 'Sr.'
    - 'Sr '
    - Lead
    - Staff
    - Principal
    - Director
    - 'VP '
    - Head of
    - Manager
    - Distinguished
    - Architect
    # Specializations Eric isn't targeting
    - AI Engineer
    - ML Engineer
    - Machine Learning
    - Data Scientist
    - Data Engineer
    - Research Scientist
    - Applied Scientist
    - Security Engineer
    - QA Engineer
    - Test Engineer
    - SDET
    - Android
    - iOS
    - Mobile
    - Embedded
    - Firmware
    - FPGA
    - ASIC
    - .NET
    - PHP
    - Ruby
    - Blockchain
    - Web3
    - Crypto
    - Salesforce
    - 'SAP '
    - COBOL
    - Mainframe
