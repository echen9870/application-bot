                  - list [ref=f32e63]:
                    - listitem [ref=f32e64]: Contribute to production-level code
                    - listitem [ref=f32e65]: Intern socials and Cockroach Labs swag
                    - listitem [ref=f32e66]: Free office lunches and snacks
                    - listitem [ref=f32e67]: Engage with executive and senior engineering leaders
